# Builds the LabBorrow Android app (android/) and publishes it as
# https://github.com/Lindrikk/LabBorrow/releases/download/app-latest/LabBorrow.apk
name: Build Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Load the signing key from the repository secrets (if set)
        env:
          KEY_BASE64: ${{ secrets.LABBORROW_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.LABBORROW_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEY_BASE64" ]; then
            echo "$KEY_BASE64" | base64 -d > "$RUNNER_TEMP/labborrow-signing.p12"
            echo "LABBORROW_KEYSTORE=$RUNNER_TEMP/labborrow-signing.p12" >> "$GITHUB_ENV"
            echo "LABBORROW_KEYSTORE_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing with the LabBorrow key."
          else
            echo "::warning::No signing key secret set; using a temporary key. Phones must uninstall the old app before installing this build."
          fi

      - name: Build the APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Publish it to the app-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk LabBorrow.apk
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest LabBorrow.apk \
            --target "$GITHUB_SHA" \
            --title "LabBorrow Android app (build $GITHUB_RUN_NUMBER)" \
            --notes "On an Android phone, download **LabBorrow.apk** and open it to install. Allow installing from your browser when Android asks. Built automatically from commit $GITHUB_SHA."

      - uses: actions/upload-artifact@v4
        with:
          name: LabBorrow-apk
          path: LabBorrow.apk
